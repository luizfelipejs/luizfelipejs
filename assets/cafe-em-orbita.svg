<svg xmlns="http://www.w3.org/2000/svg" width="864" height="260" viewBox="0 0 864 260"
     role="img" aria-labelledby="title description">
  <title id="title">Luiz Felipe</title>
  <desc id="description">Partículas em órbita e vapor subindo de uma xícara de café.</desc>

  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#141926"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#245e58" stop-opacity=".55"/>
      <stop offset=".58" stop-color="#173f40" stop-opacity=".27"/>
      <stop offset="1" stop-color="#173f40" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#90c9bf" fill-opacity=".23"/>
    </pattern>
    <radialGradient id="grid-fade">
      <stop offset=".25" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
    <mask id="grid-mask">
      <ellipse cx="650" cy="121" rx="201" ry="144" fill="url(#grid-fade)"/>
    </mask>
    <linearGradient id="cup" x2=".77" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffe5b3"/>
      <stop offset=".57" stop-color="#ffb279"/>
      <stop offset="1" stop-color="#ec7e62"/>
    </linearGradient>
    <linearGradient id="coffee" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#602f2c"/>
      <stop offset="1" stop-color="#2b1e2b"/>
    </linearGradient>
    <linearGradient id="saucer" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#83f0ce" stop-opacity="0"/>
      <stop offset=".5" stop-color="#83f0ce" stop-opacity=".75"/>
      <stop offset="1" stop-color="#83f0ce" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffe2b3"/>
      <stop offset="1" stop-color="#ffe2b3" stop-opacity="0"/>
    </linearGradient>
    <path id="spark" d="M0-8Q1.5-1.5 8 0Q1.5 1.5 0 8Q-1.5 1.5-8 0Q-1.5-1.5 0-8Z"/>
  </defs>

  <style>
    .orbit {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: rotate 9s linear infinite;
    }
    .orbit.reverse {
      animation-duration: 12s;
      animation-direction: reverse;
    }
    .steam {
      animation: rise 3.2s ease-in-out infinite;
    }
    .steam.late {
      animation-delay: -1.35s;
    }
    .spark {
      animation: twinkle 4.5s ease-in-out infinite;
    }
    .spark.late {
      animation-delay: -2.25s;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }
    @keyframes rise {
      0%, 100% { opacity: .35; transform: translateY(2px); }
      55% { opacity: .9; transform: translateY(-5px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .steam, .spark { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="862" height="258" rx="22" fill="url(#background)" stroke="#293147"/>
  <ellipse cx="651" cy="132" rx="191" ry="119" fill="url(#halo)"/>
  <rect x="454" width="399" height="260" fill="url(#grid)" mask="url(#grid-mask)"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <path d="m53 74 6 6-6 6m11 0h8" fill="none" stroke="#8cf3ce" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="86" fill="#a8c0c4" font-size="16">@luizfelipejs</text>
  </g>
  <text x="48" y="151" fill="#f4f7fb" font-size="56" font-weight="750" letter-spacing="-2.5"
        font-family="system-ui, -apple-system, sans-serif">Luiz Felipe</text>
  <path d="M52 177h50" stroke="#8cf3ce" stroke-width="3" stroke-linecap="round"/>
  <path d="M111 177h20" stroke="#486960" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(655 130) rotate(-23) scale(1 .52)" fill="none">
    <circle r="151" stroke="#4f8c86" stroke-opacity=".67" vector-effect="non-scaling-stroke"/>
    <g class="orbit">
      <g transform="rotate(28)">
        <path d="M131-75A151 151 0 0 1 151 0" stroke="#8cf3ce" stroke-opacity=".68"
              stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="151" r="10" fill="#8cf3ce" fill-opacity=".18"/>
        <circle cx="151" r="4.5" fill="#b0ffe7"/>
      </g>
      <circle cx="-151" r="3.4" fill="#68b7aa"/>
    </g>
  </g>
  <g transform="translate(655 130) rotate(26) scale(1 .46)" fill="none">
    <circle r="129" stroke="#53807e" stroke-opacity=".64" vector-effect="non-scaling-stroke"
            stroke-dasharray="2 5" stroke-linecap="round"/>
    <g class="orbit reverse">
      <g transform="rotate(154)">
        <path d="M129 0A129 129 0 0 1 112 65" stroke="#ffac79" stroke-opacity=".69"
              stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="129" r="10" fill="#ffac79" fill-opacity=".18"/>
        <circle cx="129" r="4.5" fill="#ffd5a5"/>
      </g>
    </g>
  </g>

  <g aria-hidden="true">
    <circle cx="654" cy="132" r="58" fill="#102629" fill-opacity=".83" stroke="#417167"/>
    <circle cx="654" cy="132" r="52" fill="none" stroke="#294941"/>
    <path d="M678 124h9c11 0 11 20-1 23h-10" fill="none" stroke="#f49d71" stroke-width="6"/>
    <path d="M622 122h59v17a29.5 29.5 0 0 1-59 0z" fill="url(#cup)"/>
    <ellipse cx="651.5" cy="122" rx="29.5" ry="8.8" fill="#ffe0b2"/>
    <ellipse cx="651.5" cy="122" rx="24" ry="5.7" fill="url(#coffee)"/>
    <path d="M641 121c5-1.6 15-1.5 20 .2" fill="none" stroke="#fea66f"
          stroke-opacity=".7" stroke-linecap="round"/>
    <path d="m642 141-5 4 5 4m6 2 7-12m5 2 5 4-5 4" fill="none" stroke="#663a36"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="653" cy="165" rx="38" ry="8" fill="none" stroke="url(#saucer)" stroke-width="2"/>
    <g fill="none" stroke="url(#steam)" stroke-width="2.4" stroke-linecap="round">
      <path class="steam" d="M647 109c-9-9 10-11 0-26"/>
      <path class="steam late" d="M658 107c-7-7 9-10 3-19"/>
    </g>
    <g transform="translate(752 64)" fill="#ffe1af">
      <use class="spark" href="#spark"/>
    </g>
    <g transform="translate(543 193) scale(.66)" fill="#b0ffe7">
      <use class="spark late" href="#spark"/>
    </g>
    <g transform="translate(775 184) scale(.4)" fill="#a4edda">
      <use class="spark late" href="#spark"/>
    </g>
  </g>
</svg>
