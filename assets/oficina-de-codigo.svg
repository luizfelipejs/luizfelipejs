<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270"
     role="img" aria-labelledby="title description">
  <title id="title">Oficina de código</title>
  <desc id="description">Um ferreiro em pixel art martela uma peça numa oficina à noite. A cada batida, faíscas iluminam a bigorna e um símbolo de código sai da peça.</desc>

  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="818" height="268" rx="16"/></clipPath>
    <clipPath id="window"><path d="M601 62h151v94H601z"/></clipPath>
    <linearGradient id="room" x2="0" y2="1">
      <stop stop-color="#141a27"/>
      <stop offset=".75" stop-color="#272531"/>
      <stop offset="1" stop-color="#1a1923"/>
    </linearGradient>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#17233d"/>
      <stop offset="1" stop-color="#2a495a"/>
    </linearGradient>
    <radialGradient id="forge-glow">
      <stop stop-color="#ff8d4f" stop-opacity=".43"/>
      <stop offset="1" stop-color="#ff733e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="strike-glow">
      <stop stop-color="#e2fff0" stop-opacity=".58"/>
      <stop offset=".43" stop-color="#67e7cc" stop-opacity=".27"/>
      <stop offset="1" stop-color="#67e7cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground-glow">
      <stop stop-color="#c47451" stop-opacity=".23"/>
      <stop offset="1" stop-color="#c47451" stop-opacity="0"/>
    </radialGradient>
    <pattern id="masonry" width="100" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 0h100M0 22h100M0 0v22M50 22v22" fill="none" stroke="#9f8ba4" stroke-opacity=".08"/>
    </pattern>
    <pattern id="floorboards" width="80" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0h80M0 12h80M15 0v12M51 12v12" fill="none" stroke="#997674" stroke-opacity=".19"/>
    </pattern>
    <path id="code-mark" d="M-13-4l-5 4 5 4m15-10-4 12m11-10 5 4-5 4" fill="none"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </defs>

  <style>
    svg { --cycle: 3.6s; }
    .fire { transform-box: fill-box; transform-origin: center bottom; animation: flicker .64s steps(3, end) infinite alternate; }
    .fire.shift { animation-delay: -.31s; }
    .fire-light { animation: heat 2.3s steps(4, end) infinite alternate; }
    .rain { animation: rainfall 1.5s linear infinite; }
    .rain.shift { animation-delay: -.73s; }
    .strike-glow { opacity: 0; animation: flash var(--cycle) linear infinite; }
    .spark { opacity: 0; animation: scatter var(--cycle) ease-out infinite; }
    .rune { opacity: 0; animation: lift var(--cycle) linear infinite; }
    .workpiece { animation: temper var(--cycle) linear infinite; }

    @keyframes flicker {
      from { transform: scaleY(.8); }
      to { transform: scaleY(1.14); }
    }
    @keyframes heat {
      from { opacity: .62; }
      to { opacity: .9; }
    }
    @keyframes rainfall {
      to { transform: translate(-15px, 21px); }
    }
    @keyframes flash {
      0%, 47%, 61%, 100% { opacity: 0; }
      49% { opacity: .82; }
      54% { opacity: .35; }
    }
    @keyframes scatter {
      0%, 47% { opacity: 0; transform: translate(0, 0); }
      49% { opacity: 1; transform: translate(var(--near-x), var(--near-y)); }
      61% { opacity: .9; transform: translate(var(--dx), var(--dy)); }
      71%, 100% { opacity: 0; transform: translate(var(--end-x), var(--end-y)); }
    }
    @keyframes lift {
      0%, 48% { opacity: 0; transform: translate(0, 0); }
      56% { opacity: .98; transform: translate(17px, -20px); }
      74% { opacity: .72; transform: translate(48px, -50px); }
      88%, 100% { opacity: 0; transform: translate(67px, -65px); }
    }
    @keyframes temper {
      0%, 45%, 100% { fill: #73d6ca; }
      49% { fill: #e6fff4; }
      70% { fill: #9ffbe2; }
    }

    #smith-swing {
      transform-origin: 0 0;
      transform: rotate(-59deg);
      animation: smith-strike var(--cycle) infinite;
    }
    #smith-torso {
      transform-origin: 381px 181px;
      animation: smith-brace var(--cycle) infinite;
    }
    @keyframes smith-strike {
      0%, 100% { transform: rotate(-59deg); animation-timing-function: ease-in-out; }
      24% { transform: rotate(-81deg); animation-timing-function: ease-out; }
      36% { transform: rotate(-93deg); animation-timing-function: ease-in; }
      48% { transform: rotate(0deg); animation-timing-function: ease-out; }
      54% { transform: rotate(-10deg); animation-timing-function: ease-in-out; }
      62% { transform: rotate(-7deg); animation-timing-function: ease-in-out; }
      87% { transform: rotate(-59deg); }
    }
    @keyframes smith-brace {
      0%, 87%, 100% { transform: translate(0,0); }
      32%, 36% { transform: translate(-2px,-2px); }
      48% { transform: translate(3px,3px); }
      60% { transform: translate(2px,1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fire, .fire-light, .rain, .strike-glow, .spark, .rune, .workpiece,
      #smith-swing, #smith-torso { animation: none; }
    }
  </style>

