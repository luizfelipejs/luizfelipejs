name: Atualiza o perfil

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar a fonte e o fontTools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-jetbrains-mono python3-fonttools

      - name: Gerar o cartão
        run: python3 scripts/neofetch.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- assets; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza o cartão do perfil"
          git push
