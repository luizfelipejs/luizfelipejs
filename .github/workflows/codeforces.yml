name: Card do Codeforces

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar fontes e fontTools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            fonts-ebgaramond-extra fonts-inter fonts-jetbrains-mono python3-fonttools

      - name: Gerar card
        run: python3 scripts/codeforces_card.py root.svp

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- assets; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza card do Codeforces"
          git push
