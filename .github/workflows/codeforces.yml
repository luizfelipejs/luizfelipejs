name: Card do Codeforces

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card
        run: python3 scripts/codeforces_card.py root.svp

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- assets; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza card do Codeforces"
          git push
